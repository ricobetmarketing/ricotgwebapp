<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdvantPlay</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1018;
      color: #fff;
      padding: 16px;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }
    .card {
      background: linear-gradient(180deg, #181a26, #11131d);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      background: #ff6a00;
      color: #fff;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    .btn.secondary {
      background: #252838;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .muted {
      color: #b7b9c8;
      font-size: 14px;
    }
    .leader-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #ffd9c2;
    }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,106,0,0.12);
      color: #ffb480;
      font-size: 13px;
      margin-top: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #151827;
      color: #fff;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Daily Check-in</h2>
      <div class="row">
        <button class="btn" onclick="checkIn()">Check In</button>
        <button class="btn secondary" onclick="checkGroup()">Check Group Join</button>
      </div>
      <div id="checkinStatus" class="status">Ready</div>
      <div id="xpBox" class="pill">XP: 0</div>
    </div>

    <div class="card">
      <h2>Your Rewards Journey</h2>
      <div class="muted">1) Check-in</div>
      <div class="muted">2) Invite friends</div>
      <div class="muted">3) Join group</div>
    </div>

    <div class="card">
      <h2>Your Referral Link</h2>
      <button class="btn" onclick="generateLink()">Generate Link</button>
      <input id="refLink" readonly placeholder="Your referral link will appear here" />
      <div class="row" style="margin-top:10px;">
        <button class="btn secondary" onclick="copyLink()">Copy</button>
      </div>
    </div>

    <div class="card">
      <h2>Weekly Leaderboard</h2>
      <button class="btn secondary" onclick="loadLeaderboard()">Refresh</button>
      <div id="leaderboard" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h2>Info Hub</h2>
      <div class="muted">Check in daily to earn XP.</div>
      <div class="muted">Invite friends through your unique bot start link.</div>
      <div class="muted">Group membership can be verified from backend.</div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://ricowebapp.marketing-696.workers.dev/";
    const tg = window.Telegram.WebApp;
    tg.expand();

    const telegramUser = tg.initDataUnsafe?.user || null;
    let currentUser = null;

  async function checkIn() {
  if (!telegramUser) return;

  try {
    const res = await fetch(`${WORKER_URL}/api/checkin`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ telegram_id: telegramUser.id })
    });

    const text = await res.text();
    console.log("CHECKIN RAW:", text);

    const data = JSON.parse(text);

    document.getElementById("checkinStatus").innerText =
      data.message || data.error || "Unknown response";

    if (data.ok) updateXp(data.xp || 0);

  } catch (err) {
    document.getElementById("checkinStatus").innerText = "ERROR: " + err.message;
    console.error(err);
  }
}

    async function checkIn() {
      if (!telegramUser) return;

      const res = await fetch(`${WORKER_URL}/api/checkin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telegram_id: telegramUser.id })
      });

      const data = await res.json();
      document.getElementById("checkinStatus").innerText =
        data.message || data.error || "Unknown response";

      if (data.ok) updateXp(data.xp || 0);
      loadLeaderboard();
    }

    async function generateLink() {
      if (!telegramUser) return;

      const res = await fetch(`${WORKER_URL}/api/referral-link`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telegram_id: telegramUser.id })
      });

      const data = await res.json();
      if (data.ok) {
        document.getElementById("refLink").value = data.link;
      }
    }

    async function checkGroup() {
      if (!telegramUser) return;

      const res = await fetch(`${WORKER_URL}/api/group-check`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telegram_id: telegramUser.id })
      });

      const data = await res.json();
      document.getElementById("checkinStatus").innerText =
        data.joined
          ? `Group joined: ${data.status}`
          : `Not yet joined: ${data.status}`;
    }

    async function loadLeaderboard() {
      const res = await fetch(`${WORKER_URL}/api/leaderboard`);
      const data = await res.json();

      const box = document.getElementById("leaderboard");
      box.innerHTML = "";

      if (!data.ok || !data.leaderboard?.length) {
        box.innerHTML = `<div class="muted">No leaderboard data yet.</div>`;
        return;
      }

      data.leaderboard.forEach(item => {
        const div = document.createElement("div");
        div.className = "leader-item";
        div.innerHTML = `
          <div>#${item.rank} ${item.name}</div>
          <div>${item.xp} XP</div>
        `;
        box.appendChild(div);
      });
    }

    function copyLink() {
      const input = document.getElementById("refLink");
      input.select();
      input.setSelectionRange(0, 99999);
      document.execCommand("copy");
    }

    function updateXp(xp) {
      document.getElementById("xpBox").innerText = `XP: ${xp}`;
    }

    initUser();
    loadLeaderboard();
  </script>
</body>
</html>
