<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RicoBet | Rewards</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f1018;
            --card-bg: linear-gradient(180deg, #1d1f2e 0%, #11131d 100%);
            --accent: #ff6a00;
            --accent-glow: rgba(255, 106, 0, 0.3);
            --text-main: #ffffff;
            --text-dim: #b7b9c8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; }

        /* Header / Stats */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: 1px; color: var(--accent); }
        .xp-badge {
            background: var(--accent-glow);
            border: 1px solid var(--accent);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--accent);
        }

        /* Cards */
        .section-title { font-size: 14px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Buttons */
        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #252838; margin-top: 10px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Referral Box */
        .input-group { position: relative; margin-top: 15px; }
        input {
            width: 100%;
            background: #090a0f;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-size: 13px;
        }

        /* Leaderboard */
        .leaderboard-list { margin-top: 10px; }
        .leader-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .rank { width: 30px; font-weight: bold; color: var(--accent); }
        .name { flex: 1; font-size: 15px; }
        .xp-val { font-weight: bold; color: var(--text-main); }

        /* Drops / Rewards Journey */
        .drop-empty { text-align: center; color: var(--text-dim); padding: 20px; font-size: 14px; }
        .journey-step { display: flex; gap: 10px; margin-bottom: 10px; font-size: 14px; align-items: center; }
        .check-icon { color: #00ff88; }

        .status-msg { font-size: 13px; color: var(--accent); margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">RicoBet</div>
        <div id="xpDisplay" class="xp-badge">0 XP</div>
    </div>

    <div class="section-title"><i class="fas fa-fire"></i> Campaign Rewards</div>
    <div class="card" id="dropsContainer">
        <div class="drop-empty">No active drops at the moment. Keep an eye on the channel!</div>
    </div>

    <div class="section-title"><i class="fas fa-calendar-check"></i> Daily Tasks</div>
    <div class="card">
        <div class="journey-step"><i class="fas fa-check-circle check-icon"></i> Check-in Daily</div>
        <div class="journey-step"><i class="fas fa-users"></i> Invite Friends</div>
        <button class="btn" id="checkInBtn" onclick="checkIn()">Claim Daily XP</button>
        <button class="btn btn-secondary" onclick="checkGroup()">Verify Group Join</button>
        <div id="statusMsg" class="status-msg">Welcome back!</div>
    </div>

    <div class="section-title"><i class="fas fa-link"></i> Referral Program</div>
    <div class="card">
        <button class="btn" onclick="generateLink()">Generate New Link (24h)</button>
        <div class="input-group">
            <input id="refLink" readonly placeholder="Link will appear here...">
        </div>
        <button class="btn btn-secondary" onclick="copyLink()"><i class="fas fa-copy"></i> Copy Link</button>
        <p style="font-size: 11px; color: var(--text-dim); margin-top: 10px; text-align: center;">
            Links expire every 24h for security.
        </p>
    </div>

    <div class="header" style="margin-bottom: 10px; margin-top: 20px;">
        <div class="section-title" style="margin:0;"><i class="fas fa-trophy"></i> Weekly Leaderboard</div>
        <button onclick="loadLeaderboard()" style="background:none; border:none; color:var(--accent); cursor:pointer;">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>
    <div class="card">
        <div id="leaderboard" class="leaderboard-list">
            </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://ricowebapp.marketing-696.workers.dev";
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.headerColor = "#0f1018";

    const telegramUser = tg.initDataUnsafe?.user || null;
    
    // Variable to store the full invitation sentence
    window.myInviteText = "";

    async function checkIn() {
        if (!telegramUser) return;
        const btn = document.getElementById('checkInBtn');
        btn.disabled = true;
        
        try {
            const res = await fetch(`${WORKER_URL}/api/checkin`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ telegram_id: telegramUser.id })
            });
            const data = await res.json();
            document.getElementById('statusMsg').innerText = data.message || data.error;
            if(data.ok) {
                updateXpDisplay(data.xp);
                loadLeaderboard();
            }
        } catch (e) {
            document.getElementById('statusMsg').innerText = "Connection error";
        } finally {
            btn.disabled = false;
        }
    }

    async function checkGroup() {
        if (!telegramUser) return;
        document.getElementById('statusMsg').innerText = "Verifying...";
        try {
            const res = await fetch(`${WORKER_URL}/api/group-check`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ telegram_id: telegramUser.id })
            });
            const data = await res.json();
            if (data.joined) {
                document.getElementById('statusMsg').innerText = "Verified! XP Updated.";
                updateXpDisplay(data.xp);
            } else {
                document.getElementById('statusMsg').innerText = "Please join the group first!";
            }
        } catch (e) {
            document.getElementById('statusMsg').innerText = "Verification failed.";
        }
    }

    async function generateLink() {
        if (!telegramUser) return;
        try {
            const res = await fetch(`${WORKER_URL}/api/referral-link`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ telegram_id: telegramUser.id })
            });
            const data = await res.json();
            
            if (data.ok) {
                // Update the input box visually
                document.getElementById("refLink").value = data.link;
                
                // Store the full sentence for the copy button
                // This creates: Hey! Join me on RicoBet... [Link]
window.myInviteText = `Hey! Join the RicoBet community group to earn XP and rewards. Use my link to get started: ${data.link}`;
                
                document.getElementById('statusMsg').innerText = "Link generated!";
            }
        } catch (e) {
            document.getElementById('statusMsg').innerText = "Failed to generate link.";
        }
    }

    function copyLink() {
        const textToCopy = window.myInviteText; 
        if (!textToCopy) {
            alert("Please generate a link first!");
            return;
        }

        navigator.clipboard.writeText(textToCopy).then(() => {
            alert("Invitation sentence & link copied!");
        }).catch(err => {
            // Fallback for older mobile browsers
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert("Invitation copied!");
        });
    }

    async function loadLeaderboard() {
        const box = document.getElementById("leaderboard");
        try {
            const res = await fetch(`${WORKER_URL}/api/leaderboard`);
            const data = await res.json();
            box.innerHTML = "";
            data.leaderboard.forEach(item => {
                box.innerHTML += `
                    <div class="leader-item">
                        <div class="rank">#${item.rank}</div>
                        <div class="name">${item.name}</div>
                        <div class="xp-val">${item.xp} XP</div>
                    </div>`;
            });
        } catch (e) { box.innerHTML = "Failed to load."; }
    }

    function updateXpDisplay(xp) {
        document.getElementById("xpDisplay").innerText = `${xp} XP`;
    }

    // Auto-refresh leaderboard every 5 mins
    setInterval(loadLeaderboard, 300000);

    // Initial Load
    (async () => {
        if(telegramUser) {
            try {
                const res = await fetch(`${WORKER_URL}/api/me`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user: telegramUser })
                });
                const data = await res.json();
                if(data.ok) updateXpDisplay(data.user.xp);
            } catch(e) { console.log("Init error", e); }
        }
        loadLeaderboard();
    })();
</script>
</body>
</html>
