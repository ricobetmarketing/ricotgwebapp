<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RicoBet | Rewards</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f1018;
            --card-bg: linear-gradient(180deg, #1d1f2e 0%, #11131d 100%);
            --accent: #ff6a00;
            --accent-glow: rgba(255, 106, 0, 0.3);
            --text-main: #ffffff;
            --text-dim: #b7b9c8;
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .brand { font-size: 20px; font-weight: 800; letter-spacing: 1px; color: var(--accent); }
        .xp-badge {
            background: var(--accent-glow);
            border: 1px solid var(--accent);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--accent);
        }
        .section-title { font-size: 14px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #252838; margin-top: 10px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .active-drop {
            border: 1px solid var(--accent);
            background: rgba(255, 106, 0, 0.1);
            animation: pulse 2s infinite;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 106, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 106, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 106, 0, 0); }
        }
        input {
            width: 100%;
            background: #090a0f;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 10px;
            color: white;
            font-size: 13px;
            margin-top: 15px;
        }
        .leader-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .rank { width: 30px; font-weight: bold; color: var(--accent); }
        .name { flex: 1; font-size: 15px; }
        .xp-val { font-weight: bold; color: var(--text-main); }
        .journey-step { display: flex; gap: 10px; margin-bottom: 10px; font-size: 14px; align-items: center; }
        .status-msg { font-size: 13px; color: var(--accent); margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">RicoBet</div>
        <div id="xpDisplay" class="xp-badge">0 XP</div>
    </div>

    <div class="section-title"><i class="fas fa-fire"></i> Campaign Rewards</div>
    <div class="card" id="dropsContainer">
        <div style="text-align:center; color:var(--text-dim); font-size:14px;">No active drops at the moment.</div>
    </div>

    <div class="section-title"><i class="fas fa-calendar-check"></i> Daily Tasks</div>
    <div class="card">
        <div class="journey-step"><i class="fas fa-check-circle" style="color:#00ff88;"></i> Check-in Daily</div>
        <div class="journey-step"><i class="fas fa-comments"></i> Group Activity (Chat/React)</div>
        <button class="btn" id="checkInBtn" onclick="checkIn()">Claim Daily XP</button>
        <button class="btn btn-secondary" id="activityBtn" onclick="claimActivityXp()">Claim Activity Bonus</button>
        <div id="statusMsg" class="status-msg">Welcome back!</div>
    </div>

    <div class="section-title"><i class="fab fa-telegram-plane"></i> Telegram Tasks</div>
    <div class="card">
        <p style="font-size: 13px; color: var(--text-dim);">Interact with our latest posts to earn bonus XP!</p>
        <button class="btn btn-secondary" onclick="checkPostTasks()">Check Interaction Rewards</button>
    </div>

    <div class="section-title"><i class="fas fa-link"></i> Referral Program</div>
    <div class="card">
        <button class="btn" onclick="generateLink()">Generate New Link (24h)</button>
        <input id="refLink" readonly placeholder="Link will appear here...">
        <button class="btn btn-secondary" onclick="copyLink()"><i class="fas fa-copy"></i> Copy Link</button>
    </div>

    <div class="header" style="margin-top: 20px;">
        <div class="section-title" style="margin:0;"><i class="fas fa-trophy"></i> Leaderboard</div>
        <button onclick="loadLeaderboard()" style="background:none; border:none; color:var(--accent);"><i class="fas fa-sync-alt"></i></button>
    </div>
    <div class="card" id="leaderboard"></div>
</div>

<script>
    const WORKER_URL = "https://ricowebapp.marketing-696.workers.dev";
    const tg = window.Telegram.WebApp;
    tg.expand();

    const telegramUser = tg.initDataUnsafe?.user || null;
    window.myInviteText = "";

    function updateXpDisplay(xp) {
        document.getElementById("xpDisplay").innerText = `${xp} XP`;
    }

    async function loadActiveDrops() {
        try {
            const res = await fetch(`${WORKER_URL}/api/drops`);
            const data = await res.json();
            const container = document.getElementById("dropsContainer");
            if (data.ok && data.drops.length > 0) {
                container.innerHTML = data.drops.map(drop => `
                    <div class="active-drop">
                        <h4 style="margin:0; color:var(--accent)">🔥 ${drop.title}</h4>
                        <p style="font-size:12px; margin:5px 0;">Reward: ${drop.reward_value} XP</p>
                        <button class="btn" style="padding:8px" onclick="claimDrop(${drop.id})">Claim Drop</button>
                    </div>
                `).join('');
            }
        } catch (e) { console.log("Drops load failed"); }
    }

    async function claimDrop(dropId) {
        if (!telegramUser) return;
        const res = await fetch(`${WORKER_URL}/api/claim-drop`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ telegram_id: telegramUser.id, drop_id: dropId })
        });
        const data = await res.json();
        tg.showAlert(data.message || data.error);
        if(data.ok) updateXpDisplay(data.xp);
    }

    async function checkIn() {
        if (!telegramUser) return;
        const btn = document.getElementById('checkInBtn');
        btn.disabled = true;
        try {
            const res = await fetch(`${WORKER_URL}/api/checkin`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ telegram_id: telegramUser.id })
            });
            const data = await res.json();
            document.getElementById('statusMsg').innerText = data.message || data.error;
            if(data.ok) {
                updateXpDisplay(data.xp);
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
        } catch (e) { document.getElementById('statusMsg').innerText = "Connection error"; }
        finally { btn.disabled = false; }
    }

    async function generateLink() {
        if (!telegramUser) return;
        try {
            const res = await fetch(`${WORKER_URL}/api/referral-link`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ telegram_id: telegramUser.id })
            });
            const data = await res.json();
            if (data.ok) {
                document.getElementById("refLink").value = data.link;
                window.myInviteText = `Hey! Join the RicoBet community to earn XP: ${data.link}`;
                document.getElementById('statusMsg').innerText = "Link generated!";
            }
        } catch (e) { console.log("Link failed"); }
    }

    function copyLink() {
        if (!window.myInviteText) return alert("Generate link first!");
        navigator.clipboard.writeText(window.myInviteText).then(() => alert("Copied!"));
    }

    async function claimActivityXp() {
        if (!telegramUser) return;
        const res = await fetch(`${WORKER_URL}/api/activity-check`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ telegram_id: telegramUser.id })
        });
        const data = await res.json();
        document.getElementById('statusMsg').innerText = data.message;
        if(data.ok) updateXpDisplay(data.xp);
    }

    async function checkPostTasks() {
        if (!telegramUser) return;
        const res = await fetch(`${WORKER_URL}/api/me`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user: telegramUser })
        });
        const data = await res.json();
        if(data.ok && data.new_reward_msg) {
            updateXpDisplay(data.user.xp);
            tg.showAlert(`Reward: ${data.new_reward_msg}`);
        } else {
            document.getElementById('statusMsg').innerText = "No new rewards found yet.";
        }
    }

    async function loadLeaderboard() {
        try {
            const res = await fetch(`${WORKER_URL}/api/leaderboard`);
            const data = await res.json();
            const box = document.getElementById("leaderboard");
            box.innerHTML = data.leaderboard.map(item => `
                <div class="leader-item">
                    <div class="rank">#${item.rank}</div>
                    <div class="name">${item.name}</div>
                    <div class="xp-val">${item.xp} XP</div>
                </div>
            `).join('');
        } catch (e) { console.log("Leaderboard failed"); }
    }

    // Single initialization block
    (async () => {
        if(telegramUser) {
            try {
                const res = await fetch(`${WORKER_URL}/api/me`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user: telegramUser })
                });
                const data = await res.json();
                if(data.ok) {
                    updateXpDisplay(data.user.xp);
                    if(data.new_reward_msg) {
                        setTimeout(() => {
                            tg.showAlert(`✨ MISSION COMPLETE ✨\n\n${data.new_reward_msg}`);
                            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        }, 1000);
                    }
                }
                // Automatic Group Check
                fetch(`${WORKER_URL}/api/group-check`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ telegram_id: telegramUser.id })
                });
            } catch(e) { console.log("Init failed", e); }
        }
        loadLeaderboard();
        loadActiveDrops();
    })();

    setInterval(loadLeaderboard, 300000);
</script>
</body>
</html>
