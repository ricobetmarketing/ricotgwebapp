<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AdvantPlay</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1018;
  color: #fff;
  padding: 16px;
}
.wrap { max-width: 760px; margin: 0 auto; }
.card {
  background: linear-gradient(180deg,#181a26,#11131d);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
  border:1px solid rgba(255,255,255,0.08);
}
h2 { margin-bottom:10px; }

.btn {
  border:0;
  padding:12px;
  border-radius:12px;
  background:#ff6a00;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.btn.secondary {
  background:#252838;
}

.row { display:flex; gap:10px; flex-wrap:wrap; }

.status { margin-top:10px; font-size:14px; }
.pill {
  margin-top:6px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,106,0,0.15);
}

.leader-item {
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

input {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);
  background:#151827;
  color:#fff;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h2>Daily Check-in</h2>
    <div class="row">
      <button class="btn" onclick="checkIn()">Check In</button>
      <button class="btn secondary" onclick="checkGroup()">Check Group</button>
    </div>
    <div id="checkinStatus" class="status">Initializing...</div>
    <div id="xpBox" class="pill">XP: 0</div>
  </div>

  <div class="card">
    <h2>Referral</h2>
    <button class="btn" onclick="generateLink()">Generate Link</button>
    <input id="refLink" readonly placeholder="Your referral link" />
    <button class="btn secondary" onclick="copyLink()">Copy</button>
  </div>

  <div class="card">
    <h2>Leaderboard</h2>
    <button class="btn secondary" onclick="loadLeaderboard()">Refresh</button>
    <div id="leaderboard"></div>
  </div>

</div>

<script>
const WORKER_URL = "https://ricowebapp.marketing-696.workers.dev";
const tg = window.Telegram.WebApp;
tg.expand();

const telegramUser = tg.initDataUnsafe?.user || null;
let currentUser = null;

// ===== INIT USER =====
async function initUser() {
  if (!telegramUser) {
    document.getElementById("checkinStatus").innerText =
      "Open via Telegram bot";
    return;
  }

  try {
    const res = await fetch(`${WORKER_URL}/api/me`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ user: telegramUser })
    });

    const data = await res.json();

    if (data.ok) {
      currentUser = data.user;
      updateXp(data.user.xp || 0);
      document.getElementById("checkinStatus").innerText = "Ready";
    } else {
      document.getElementById("checkinStatus").innerText = data.error;
    }

  } catch (e) {
    document.getElementById("checkinStatus").innerText = "Init error";
    console.error(e);
  }
}

// ===== CHECK IN =====
async function checkIn() {
  if (!telegramUser) return;

  if (!currentUser) {
    document.getElementById("checkinStatus").innerText = "Initializing...";
    await initUser();
  }

  try {
    const res = await fetch(`${WORKER_URL}/api/checkin`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ telegram_id: telegramUser.id })
    });

    const text = await res.text();
    console.log("CHECKIN:", text);

    const data = JSON.parse(text);

    document.getElementById("checkinStatus").innerText =
      data.message || data.error;

    if (data.ok) updateXp(data.xp);

  } catch (e) {
    document.getElementById("checkinStatus").innerText = "Error";
    console.error(e);
  }
}

// ===== REFERRAL =====
async function generateLink() {
  const res = await fetch(`${WORKER_URL}/api/referral-link`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ telegram_id: telegramUser.id })
  });

  const data = await res.json();
  if (data.ok) {
    document.getElementById("refLink").value = data.link;
  }
}

// ===== GROUP CHECK =====
async function checkGroup() {
  const res = await fetch(`${WORKER_URL}/api/group-check`, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ telegram_id: telegramUser.id })
  });

  const data = await res.json();

  document.getElementById("checkinStatus").innerText =
    data.joined ? "Joined ✅" : "Not joined ❌";
}

// ===== LEADERBOARD =====
async function loadLeaderboard() {
  const res = await fetch(`${WORKER_URL}/api/leaderboard`);
  const data = await res.json();

  const box = document.getElementById("leaderboard");
  box.innerHTML = "";

  if (!data.leaderboard?.length) {
    box.innerHTML = "No data yet";
    return;
  }

  data.leaderboard.forEach(u => {
    box.innerHTML += `
      <div class="leader-item">
        <span>#${u.rank} ${u.name}</span>
        <span>${u.xp} XP</span>
      </div>
    `;
  });
}

// ===== UTIL =====
function copyLink() {
  const input = document.getElementById("refLink");
  input.select();
  document.execCommand("copy");
}

function updateXp(xp) {
  document.getElementById("xpBox").innerText = "XP: " + xp;
}

// ===== START =====
(async () => {
  await initUser();
  loadLeaderboard();
})();
</script>

</body>
</html>
